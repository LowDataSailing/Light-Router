[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "light-router"
version = "0.1.0"
description = "Communication-constrained, vessel-conditioned weather-routing system for low-bandwidth sailing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Lilian Bosc", email = "contactlilian3@gmail.com"}
]
keywords = [
    "sailing",
    "routing",
    "weather",
    "grib",
    "low-data",
    "satellite",
    "navigation",
    "compression",
    "isochrone",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.24.0",
    "xarray>=2023.0.0",
]

[project.urls]
Homepage = "https://github.com/LowDataSailing/Light-Router"
Documentation = "https://lowdatasailing.github.io/Light-Router/"
Repository = "https://github.com/LowDataSailing/Light-Router.git"
Issues = "https://github.com/LowDataSailing/Light-Router/issues"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "mypy>=1.0.0",
    "ruff>=0.6",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "mkdocs-git-authors-plugin>=0.9.0",
]
grib = [
    "cfgrib>=0.9.10.4",
    "eccodes>=1.7.0",
]
artifacts = [
    "gpxpy>=1.6",
]
plot = [
    "matplotlib>=3.7",
]
# Oracle reference routers (issue #22). Optional on purpose: libweatherrouting
# is GPLv3, so it must never be a core dependency and is imported lazily
# inside experiments/oracle/libweatherrouting.py only.
oracle = [
    "weatherrouting>=0.2.3",
]
# ml = [
#     "scikit-learn>=1.2.0",
#     "torch>=2.0.0",
# ]
# performance = [
#     "psutil>=5.9.0",
#     "memory-profiler>=0.61.0",
# ]

[tool.hatch.build.targets.wheel]
packages = ["src/light_router"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [".venv", "site", "data/cache", "experiments/output"]

[tool.ruff.lint]
# mirror the flake8 defaults this repo used before the ruff migration
select = ["E", "W", "F"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short --import-mode=importlib"
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false  # numpy ufunc results are typed Any by the stubs
warn_unused_configs = true
ignore_missing_imports = true
