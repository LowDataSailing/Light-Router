[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "light-router"
version = "0.1.0"
description = "Communication-constrained, vessel-conditioned weather-routing system for low-bandwidth sailing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Lilian Bosc", email = "contactlilian3@gmail.com"}
]
keywords = [
    "sailing",
    "routing",
    "weather",
    "grib",
    "low-data",
    "satellite",
    "navigation",
    "compression",
    "isochrone",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # "numpy>=1.24.0",
    # "scipy>=1.10.0",
    # "xarray>=2023.0.0",
    # "cfgrib>=0.9.10.4",
]

[project.urls]
Homepage = "https://github.com/LowDataSailing/Light-Router"
Documentation = "https://lowdatasailing.github.io/Light-Router/"
Repository = "https://github.com/LowDataSailing/Light-Router.git"
Issues = "https://github.com/LowDataSailing/Light-Router/issues"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "mkdocs-git-authors-plugin>=0.9.0",
]
# ml = [
#     "scikit-learn>=1.2.0",
#     "torch>=2.0.0",
# ]
# performance = [
#     "psutil>=5.9.0",
#     "memory-profiler>=0.61.0",
# ]

[tool.hatch.build.targets.wheel]
packages = ["src/light_router"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
