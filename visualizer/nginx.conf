server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 512;

    # No directory listings; only generated pages are reachable.
    autoindex off;

    location / {
        try_files $uri $uri/ =404;
    }
}
