<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Light-Router passage visualizer</title>
  <link rel="stylesheet" href="../../assets/vendor/leaflet.css">
  <link rel="stylesheet" href="../../assets/style.css">
</head>
<body>
  <header id="topbar">
    <div id="run-title">Light-Router</div>
    <div id="run-meta"></div>
    <a id="backlink" href="../../index.html">&larr; experiments</a>
  </header>

  <main>
    <div id="map-wrap">
      <div id="map"></div>
    </div>

    <aside id="panel">
      <h3>Boats</h3>
      <table id="boat-table">
        <thead>
          <tr><th></th><th>budget</th><th>hdg</th><th>sog</th><th>tws</th><th>twa</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <h3>Layers</h3>
      <div id="toggles">
        <label><input type="checkbox" id="wind-toggle" checked> truth wind</label>
        <div id="wind-legend">
          <div id="wind-legend-bar"></div>
          <div id="wind-legend-labels"><span>0</span><span>12</span><span>25 m/s</span></div>
        </div>
      </div>
      <div id="budget-toggles"></div>

      <h3>Run</h3>
      <div id="run-details"></div>
    </aside>
  </main>

  <footer id="controls">
    <button id="play" aria-label="play/pause">&#9654;</button>
    <input type="range" id="timeline" min="0" max="0" value="0" step="1">
    <span id="time-label">t = 0 h</span>
    <span id="frame-label"></span>
  </footer>

  <script src="../../assets/vendor/leaflet.js"></script>
  <script src="../../assets/app.js"></script>
</body>
</html>
