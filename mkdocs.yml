site_name: Light Router
site_description: Learning how little weather information a sailing router needs — bandwidth-constrained weather-routing research
site_author: LowDataSailing
site_url: https://lowdatasailing.github.io/Light-Router

# Repository
repo_name: LowDataSailing/Light-Router
repo_url: https://github.com/LowDataSailing/Light-Router
edit_uri: edit/master/docs/

# Navigation
nav:
  - Home: index.md
  - Project:
      - Overview: PROJECT_DESCRIPTION.md
      - Objectives: objectives.md
  - Documentation:
      - Literature Review: literature-review.md
      - Benchmarking: benchmarking.md
      - Market Positioning: market-positioning.md
      - Meteorological Info Transfer: meteorological-info-transfer.md
      - Routing Algorithms: routing-algorithms.md
      - Research Ideas: research-ideas.md
  - Development:
      - Contributing: CONTRIBUTING.md
  - About: about.md

# Theme
theme:
  name: material
  language: en
  palette:
    # Primary colors
    primary:
      main: '#1a73e8'
      light: '#6ec6ff'
      dark: '#0d47a1'
    # Accent colors
    accent:
      main: '#ff5722'
      light: '#ff8a50'
      dark: '#c41c00'
  font:
    text: 'Roboto'
    code: 'Roboto Mono'
  features:
    - navigation.top
    - navigation.sections
    - navigation.expand
    - navigation.path
    - toc.integrate
    - search.suggest
    - search.highlight
    - header.autohide
  # favicon: assets/images/favicon.ico
  # logo: assets/images/logo.png

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: LowDataSailing
      repo: Light-Router
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\[\],\s]+'
  - git-revision-date-localized:
      enabled: true
      type: timeago
      timezone: UTC
  - git-authors:
      enabled: true
  # PDF export disabled (requires system libraries)
